<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Timeline">
  <meta name="referrer" content="no-referrer">
  <title>Timeline</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-title" id="title">Actus</div>
    <button class="icon-btn" id="refresh" aria-label="Rafraîchir">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 4a8 8 0 0 1 7.75 6h-2.1A6 6 0 1 0 18 14h2.07A8 8 0 1 1 12 4Zm5 0h4v4h-1.5V6.56l-2.2 2.2-1.06-1.06 2.2-2.2H17V4Z"/></svg>
    </button>
  </header>

  <main>
    <section id="view-actus" class="view active" aria-label="Actus">
      <div class="ptr" id="ptr"><span class="spinner"></span></div>
      <div id="actus-list" class="feed"></div>
      <div id="actus-sentinel" class="sentinel"></div>
      <footer class="feed-footer" id="actus-footer"></footer>
    </section>

    <section id="view-videos" class="view" aria-label="Vidéos">
      <div id="videos-list" class="reels"></div>
    </section>
  </main>

  <nav class="tabbar" aria-label="Navigation">
    <button class="tab active" data-view="actus" aria-label="Actus">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M4 4h13a3 3 0 0 1 3 3v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4Zm2 2v12h12V7a1 1 0 0 0-1-1H6Zm2 2h8v2H8V8Zm0 4h8v2H8v-2Zm0 4h5v2H8v-2Z"/></svg>
      <span>Actus</span>
    </button>
    <button class="tab" data-view="videos" aria-label="Vidéos">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M4 5h11a2 2 0 0 1 2 2v2.4l4-2.4v10l-4-2.4V17a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Zm0 2v10h11V7H4Z"/></svg>
      <span>Vidéos</span>
    </button>
  </nav>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-handle"></div>
    <button class="sheet-btn" id="sheet-less">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20Zm0 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16Zm5 7v2H7v-2h10Z"/></svg>
      <span><strong>Moins de ça</strong><small id="sheet-less-sub"></small></span>
    </button>
    <a class="sheet-btn" id="sheet-open" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M14 3h7v7h-2V6.41l-8.29 8.3-1.42-1.42 8.3-8.29H14V3ZM5 5h6v2H5v12h12v-6h2v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/></svg>
      <span><strong>Ouvrir l'original</strong></span>
    </a>
    <button class="sheet-btn cancel" id="sheet-cancel">Annuler</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js" type="module"></script>
</body>
</html>
