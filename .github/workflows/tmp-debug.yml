name: tmp debug videos
on:
  push:
    branches: [claude/project-thread-efih1j]
jobs:
  dbg:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run collect 2>&1 | tee /tmp/collect.log && grep -A16 "^Droite\|^Vidéos :" /tmp/collect.log
        env:
          BSKY_IDENTIFIER: ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
      - run: ls public/data; node scripts/tmp/videos-debug.mjs
